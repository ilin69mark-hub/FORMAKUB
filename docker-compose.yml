services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # ADR-01 / INFRA-SQLITE-001: production работает только на SQLite;
      # отсутствие или неверное значение — явная ошибка запуска (storage/index.ts).
      - FORMAKUB_STORAGE=sqlite
      # ADR-02 / Keycloak OIDC. Пустые значения не подменяются: приложение
      # fail-closed (auth 503), пока владелец не задаст issuer/secret.
      - KEYCLOAK_ISSUER_URL=${KEYCLOAK_ISSUER_URL:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-formakub-admin}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-formakub-admin-api}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - FORMAKUB_AUTH_SECRET=${FORMAKUB_AUTH_SECRET:-}
      - FORMAKUB_AUTH_REDIRECT_URI=${FORMAKUB_AUTH_REDIRECT_URI:-}
      - FORMAKUB_ADMIN_UI=${FORMAKUB_ADMIN_UI:-}
      - FORMAKUB_RECALC_WORKER=${FORMAKUB_RECALC_WORKER:-}
      # NEW-N4 / D-9: явный production-маркер и разрешение публикации Rules
      # Snapshot. По умолчанию публикация выключена; включать только после
      # CA-T-511 и подтверждения норм.
      - FORMAKUB_ENV=${FORMAKUB_ENV:-production}
      - FORMAKUB_RULES_PUBLICATION_ENABLED=${FORMAKUB_RULES_PUBLICATION_ENABLED:-}
      # ADR-03: плановые backup включены в production (1 час); 0 — выключено.
      - FORMAKUB_BACKUP_INTERVAL_MS=${FORMAKUB_BACKUP_INTERVAL_MS:-3600000}
      # Внешнее S3-совместимое хранилище (ADR-03). Пустые значения отключают
      # выгрузку, а не создают фиктивные credentials; задаются при деплое.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=${S3_PREFIX:-backups/}
    volumes:
      # Постоянный том: formakub.db (+ WAL/SHM) переживает пересоздание контейнера.
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
